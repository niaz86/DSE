name: DSE Daily Update Summary 

on:
  schedule:
    - cron: "0 12 * * *"   # Runs daily (6PM Bangladesh time approx)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          pip install requests beautifulsoup4 openpyxl

      - name: Run script
        run: python DSE_Summary.py

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add dse_market_summary.xlsx
          git commit -m "📊 Daily DSE update" || echo "No changes"
          git push

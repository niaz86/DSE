<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSE Live Dashboard</title>

<style>
body { background:#0b0f14; color:#e6edf3; font-family:Arial; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { padding:10px; border-bottom:1px solid #222; text-align:left; }
th { color:#00ff88; }
.up { color:#00ff88; }
.down { color:#ff4d6d; }

.ticker {
  white-space: nowrap;
  overflow: hidden;
  background:#003d1f;
  padding:10px;
}
.ticker span {
  margin-right:40px;
}
</style>
</head>

<body>

<h1>DSE Live Stock Dashboard</h1>

<!-- TICKER -->
<div class="ticker">
  <div id="ticker"></div>
</div>

<!-- TABLE -->
<table>
  <thead>
    <tr>
      <th>Code</th>
      <th>Company</th>
      <th>Sector</th>
      <th>Price</th>
      <th>P/E</th>
      <th>NAV</th>
      <th>Market Cap</th>
      <th>Updated</th>
    </tr>
  </thead>
  <tbody id="stock-table-body"></tbody>
</table>

<script>

// ==========================
// LOAD JSON DATA
// ==========================
async function loadData() {
  try {
    const res = await fetch("https://github.com/niaz86/DSE/blob/master/dse_companies.json");
    const json = await res.json();

    const data = Object.values(json);

    createTicker(data);
    createTable(data);

  } catch (err) {
    console.error("Error loading data:", err);
  }
}

// ==========================
// CREATE TICKER
// ==========================
function createTicker(data) {
  const ticker = document.getElementById("ticker");

  const html = data.slice(0, 30).map(stock => {
    const price = parseFloat(stock.opening_price || 0);
    const pe = parseFloat(stock.trailing_pe || 0);

    const up = pe > 10;

    return `
      <span class="${up ? 'up' : 'down'}">
        ${stock.trading_code} ${price}
      </span>
    `;
  }).join("");

  ticker.innerHTML = html + html;
}

// ==========================
// CREATE TABLE
// ==========================
function createTable(data) {
  const tbody = document.getElementById("stock-table-body");

  tbody.innerHTML = data.map(stock => `
    <tr>
      <td>${stock.trading_code}</td>
      <td>${stock.company_name}</td>
      <td>${stock.sector}</td>
      <td>${stock.opening_price}</td>
      <td>${stock.trailing_pe}</td>
      <td>${stock.nav_per_share}</td>
      <td>${stock.market_cap_mn}</td>
      <td>${stock.last_updated}</td>
    </tr>
  `).join("");
}

// ==========================
// AUTO REFRESH (optional)
// ==========================
setInterval(loadData, 300000);

// RUN FIRST TIME
loadData();

</script>

</body>
</html>
